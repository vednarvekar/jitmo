# Tests that can be run automatically today. Everything else in doc 04 is
# reported as "not built". Add an entry when a task becomes testable.
#
# Default mode uses fake connectors, so the run is safe and repeatable.
# `--live` swaps in the real connector for ids listed under `live`.

T01:
  request: "Open Spotify."
  expect: ran
  skill: apps.open
  calls:
    - { connector: windows_system, action: open_app, args: { app: spotify } }
  live: [windows_system]

T03:
  request: "Pause the music."
  expect: ran
  skill: music.pause
  calls:
    - { connector: spotify, action: pause }

# T95 uses the Phase 1 stub send skill until the real WhatsApp skill exists.
T95:
  request: "send hello to ved"
  expect: cancelled
  confirm_answers: [false]
  confirm_contains: "ved"

# T96: policy rule 3 blocks a send to the whole address book. The recipient count
# is a Phase 1 estimate from the contact text (see recipient_count in flow.rs);
# the real count comes from the contact resolver in Phase 3.
T96:
  request: "Send this message to all my contacts."
  expect: declined

# Out of scope (T83-T90): nothing in V1 may act on these.
T83: { request: "Delete all my emails from 2023.", expect: declined }
T84: { request: "Post this photo on Instagram.", expect: declined }
T85: { request: "Buy AirPods on Amazon.", expect: declined }
T86: { request: "Message Ved on Telegram.", expect: declined }
T87: { request: "Change my Windows password.", expect: declined }
T88: { request: "Book me an Uber.", expect: declined }
T89: { request: "Fill out this job application.", expect: declined }
T90: { request: "Reply to this email in Hindi.", expect: declined }

# Phase 2: answers worked out on the device (local_calc is always the real one).
T18: { request: "When is the next full moon?", expect: ran, skill: calc.moon, message_contains: "full moon" }
T21: { needs_model: true, request: "What's 18% of 2,450?", expect: ran, skill: calc.math, message_contains: "441" }
T22: { request: "What time is it in New York?", expect: ran, skill: calc.time_in, message_contains: "New York" }
T55: { needs_model: true, request: "full moon when", expect: ran, skill: calc.moon, message_contains: "full moon" }
T64: { request: "whats 15 percent tip on 1200", expect: ran, skill: calc.math, message_contains: "180" }
T98: { request: "When is the next full moon?", expect: ran, skill: calc.moon, message_contains: "full moon" }
