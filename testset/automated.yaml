# Tests that can be run automatically today. Everything else in doc 04 is
# reported as "not built". Add an entry when a task becomes testable.
#
# Default mode uses fake connectors, so the run is safe and repeatable.
# `--live` swaps in the real connector for ids listed under `live`.

T01:
  request: "Open Spotify."
  apps: ["Notepad", "Spotify", "Visual Studio Code"]
  expect: ran
  skill: apps.open
  calls:
    - { connector: windows_system, action: open_app, args: { app: Spotify } }
  live: [windows_system]

T03:
  request: "Pause the music."
  expect: ran
  skill: music.control
  calls:
    - { connector: spotify, action: control, args: { text: "Pause the music." } }

# T95 uses the Phase 1 stub send skill until the real WhatsApp skill exists.
T95:
  request: "send hello to ved"
  expect: cancelled
  confirm_answers: [false]
  confirm_contains: "ved"

# T96: policy rule 3 blocks a send to the whole address book. The recipient count
# is a Phase 1 estimate from the contact text (see recipient_count in flow.rs);
# the real count comes from the contact resolver in Phase 3.
T96:
  request: "Send this message to all my contacts."
  expect: declined

# Closed lists. The engine knows the installed apps and the saved contacts (learned from
# use, or imported from a vCard file); the runner supplies both. "spotify" becomes the
# installed app's real name.
# T94: two saved contacts called Ved. The engine must ask which one; the runner dismisses
# the question and nothing may be sent.
T94:
  needs_model: true
  request: "Send the file to Ved."
  files: ["report.pdf"]
  selected: ["report.pdf"]
  contacts:
    - { name: "Ved Narvekar", phone: "+91 98765 43210" }
    - { name: "Ved Patel", phone: "+91 91234 56789" }
  expect: asks_question

# T52 (routing part, fake connector): the newest PDF, the saved contact found by first
# name, and a confirm card that shows the exact name and number.
T52:
