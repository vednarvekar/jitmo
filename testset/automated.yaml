T57: { known_failing: "the router sends loose volume wording to media control (A3, 0.86) instead of S1; the SP1 near-neighbour confusion. Needs real-log retraining.", needs_model: true, request: "louder", expect: ran, skill: system.volume, calls: [{ connector: system_controls, action: adjust, args: { text: "louder" } }] }
T62: { needs_model: true, request: "wifi off", expect: ran, skill: system.radio, calls: [{ connector: system_controls, action: radio, args: { text: "wifi off" } }] }

