[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/llm",
    "crates/skills",
    "crates/connectors",
    "crates/adapter-windows",
    "crates/model-worker",
    "crates/store",
    "crates/ipc",
    "crates/testset-runner",
    "app/src-tauri",
]
# Throwaway spike code keeps its own Cargo projects.
exclude = ["spikes", "server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# Pinned centrally. Each crate is license-checked before use (D23).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

# Keep the build folder (target/) small: full debug symbols for every dependency made it
# 28 GB. Line tables keep backtraces readable; dependencies get no debug info at all.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
