[package]
name = "jitmo-app"
description = "Command bar: Tauri shell that hosts Core and shows the UI."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Embed the built UI instead of loading the dev server. `tauri build` turns this on;
# plain `cargo build --release -p jitmo-app --features custom-protocol` does the same.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
jitmo-connectors = { path = "../../crates/connectors" }
jitmo-core = { path = "../../crates/core" }
jitmo-adapter-windows = { path = "../../crates/adapter-windows" }
jitmo-model-worker = { path = "../../crates/model-worker", default-features = false }
jitmo-ipc = { path = "../../crates/ipc" }
jitmo-skills = { path = "../../crates/skills" }
jitmo-store = { path = "../../crates/store" }
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
