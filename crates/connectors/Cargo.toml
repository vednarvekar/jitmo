[package]
name = "jitmo-connectors"
description = "Connector trait and the app connectors."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
regex = "1"
serde_json.workspace = true
# Windows uses the built-in TLS (schannel), so no C compiler or extra tools are needed.
sha2 = "0.10"
base64 = "0.23"
ureq = { version = "3", default-features = false, features = ["native-tls"] }
jitmo-store = { path = "../store" }

[target.'cfg(windows)'.dependencies]
jitmo-adapter-windows = { path = "../adapter-windows" }
