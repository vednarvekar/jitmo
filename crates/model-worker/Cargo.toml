[package]
name = "jitmo-model-worker"
description = "Separate model process (no network) and the client Core uses to talk to it."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "jitmo_model_worker"

[[bin]]
name = "jitmo-model-worker"
path = "src/main.rs"

[dependencies]
jitmo-ipc = { path = "../ipc" }
thiserror.workspace = true
tracing.workspace = true
ort = { version = "=2.0.0-rc.15", optional = true }
regex = { version = "1", optional = true }
serde.workspace = true
serde_json.workspace = true
tokenizers = { version = "0.21", optional = true, default-features = false, features = ["onig"] }

[features]
default = ["models"]
models = ["dep:ort", "dep:tokenizers", "dep:regex"]
