[package]
name = "jitmo-testset-runner"
description = "Runs the 100 tests from doc 04 and records pass or fail, time and peak memory."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
# `cargo run -p jitmo-testset-runner` (as CI runs it) runs the test-set runner, not the audit.
default-run = "jitmo-testset-runner"

[dependencies]
jitmo-connectors = { path = "../connectors" }
jitmo-core = { path = "../core" }
jitmo-ipc = { path = "../ipc" }
jitmo-skills = { path = "../skills" }
jitmo-store = { path = "../store" }
jitmo-model-worker = { path = "../model-worker", default-features = false }
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(windows)'.dependencies]
jitmo-adapter-windows = { path = "../adapter-windows" }

# The skills audit: drives the real Flow and router over a corpus of messy inputs
# (docs/03-delivery/9 - Skills Audit.md). Deterministic, no network.
[[bin]]
name = "jitmo-audit"
path = "src/bin/audit.rs"
