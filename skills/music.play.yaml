id: music.play
title: "Play music"  # task A2
task: A2
version: 1
category: apps
capabilities:
  - media.control
network: none
limits:
  cpu_ms: 200
  timeout_s: 10
risk: safe
examples:
  - "play arijit singh on spotify"
  - "play some jazz"
  - "put on some arijit"
  - "play Arijit Singh"
slots: {}
steps:
  - connector: spotify
    action: search
    args: { text: "{request}", what: "{what?}" }
check:
  connector: spotify
  action: search
  args: { text: "{request}", what: "{what?}" }
undo: none
tool:
  args:
    what: { description: "the song, artist or kind of music", required: true, ask: "What should I play?" }
  phrase: "play {what}"
