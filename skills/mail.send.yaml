id: mail.send
title: "Send an email"  # task E7
task: E7
version: 1
category: email
capabilities:
  - mail.send
network: ms365
limits:
  cpu_ms: 500
  timeout_s: 20
risk: sends_or_shares
examples:
  - "email rahul that the report is ready"
  - "send rahul an email saying the report is ready"
  - "email priya saying thanks"
slots:
  contact:
    type: contact
    required: true
    resolve: [named_contact]
confirm:
  text: "Send this email to {contact}? “{message}”"
steps:
  - connector: outlook
    action: send
    args: { to: "{contact}", text: "{request}" }
check:
  connector: outlook
  action: send
  args: { to: "{contact}", text: "{request}" }
undo: none
tool:
  args:
    to: { type: person, description: "who to email, the exact name", required: true, ask: "Who should I email?" }
    body: { description: "the words to send, written as the user meant them", required: true, ask: "What should it say?" }
  phrase: "email {to} that {body}"
