id: mail.draft
title: "Draft a reply"  # task E5
task: E5
version: 1
category: email
capabilities:
  - mail.write
network: ms365
limits:
  cpu_ms: 500
  timeout_s: 20
risk: changes_data
examples:
  - "draft a reply to rahul saying friday works"
  - "draft an email to rahul that the report is ready"
  - "write a draft reply to priya saying thanks"
slots:
  contact:
    type: contact
    required: true
    resolve: [named_contact]
steps:
  - connector: outlook
    action: draft
    args: { to: "{contact}", text: "{request}", body: "{message?}" }
check:
  connector: outlook
  action: draft
  args: { to: "{contact}", text: "{request}", body: "{message?}" }
undo:
  - connector: outlook
    action: draft
tool:
  args:
    to: { type: person, description: "who the draft is for", required: true, ask: "Who is the draft for?" }
    body: { description: "the words of the draft", required: true, ask: "What should it say?" }
  phrase: "draft an email to {to} saying {body}"
