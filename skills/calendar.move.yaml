id: calendar.move
title: "Move a meeting"  # task C7
task: C7
version: 1
category: calendar
capabilities:
  - calendar.send
network: ms365
limits:
  cpu_ms: 500
  timeout_s: 20
risk: sends_or_shares
examples:
  - "move my 3pm to tomorrow same time"
  - "move my 3pm meeting to friday at 4pm"
  - "reschedule my 3pm to tomorrow"
slots: {}
confirm:
  text: "Move the meeting and tell the attendees? {request}"
steps:
  - connector: outlook_calendar
    action: move
    args: { text: "{request}", event: "{event?}", to: "{to?}" }
check:
  connector: outlook_calendar
  action: move
  args: { text: "{request}", event: "{event?}", to: "{to?}" }
undo:
  - connector: outlook_calendar
    action: move
tool:
  args:
    event: { description: "the meeting to move, by its time or title: my 3pm, tomorrow's standup, the design review", required: true, ask: "Which meeting?" }
    to: { type: time, description: "where it goes: 4pm, tomorrow, friday morning, next week, an hour later", required: true, ask: "To when?" }
  phrase: "move {event} to {to}"
