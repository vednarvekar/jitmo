id: calc.moon
title: "Moon phase"  # task Q1 (moon, sunrise, sunset: the connector reads the sentence)
task: Q1
version: 2
category: answers
capabilities:
  - calc.local
network: none
limits:
  cpu_ms: 200
  timeout_s: 5
risk: read_only
examples:
  - "when is the next full moon"
  - "next new moon"
  - "when does the sun set today"
  - "when is sunset"
  - "sunrise tomorrow in Mumbai"
