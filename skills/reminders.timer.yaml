id: reminders.timer
title: "Set a timer"  # task R2
task: R2
version: 1
category: reminders
capabilities:
  - reminders.write
network: none
limits:
  cpu_ms: 200
  timeout_s: 5
risk: changes_data
examples:
  - "set a 10-minute timer"
  - "set a timer for an hour"
slots: {}
steps:
  - connector: reminders
    action: set
    args: { text: "{request}", length: "{length?}" }
check:
  connector: reminders
  action: set
  args: { text: "{request}", length: "{length?}" }
undo:
  - connector: reminders
    action: set
tool:
  args:
    length: { type: duration, description: "how long: 10 minutes, half an hour", required: true, ask: "For how long?" }
  phrase: "set a timer for {length}"
