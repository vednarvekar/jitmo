id: music.control
title: "Control the music"  # task A3
task: A3
version: 1
category: apps
capabilities:
  - media.control
network: none
limits:
  cpu_ms: 200
  timeout_s: 10
risk: safe
examples:
  - "pause the music"
  - "pause"
  - "pause spotify"
  - "skip this song"
  - "next song"
  - "resume the music"
slots: {}
steps:
  - connector: spotify
    action: control
    args: { text: "{request}" }
check:
  connector: spotify
  action: control
  args: { text: "{request}" }
undo: none
