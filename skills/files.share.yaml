id: files.share
title: "Share a folder"  # task F6
task: F6
version: 1
category: files
capabilities:
  - files.share
network: ms365
limits:
  cpu_ms: 500
  timeout_s: 20
risk: sends_or_shares
examples:
  - "share the project folder with priya"
  - "give priya access to the project folder"
  - "share the reports folder with rahul"
slots:
  contact:
    type: contact
    required: true
    resolve: [named_contact]
confirm:
  text: "Share the folder with {contact}?"
steps:
  - connector: onedrive
    action: share
    args: { text: "{request}", with: "{contact}" }
check:
  connector: onedrive
  action: share
  args: { text: "{request}", with: "{contact}" }
undo:
  - connector: onedrive
    action: share
