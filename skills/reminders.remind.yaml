id: reminders.remind
title: "Set a reminder"  # task R1
task: R1
version: 1
category: reminders
capabilities:
  - reminders.write
network: none
limits:
  cpu_ms: 200
  timeout_s: 5
risk: changes_data
examples:
  - "remind me to call mom at 6pm"
  - "remind me tomorrow at 9am to send the report"
  - "remind me every day at 9am to take vitamins"
  - "every Monday at 10 remind me to send the report"
slots: {}
steps:
  - connector: reminders
    action: set
    args: { text: "{request}" }
check:
  connector: reminders
  action: set
  args: { text: "{request}" }
undo:
  - connector: reminders
    action: set
